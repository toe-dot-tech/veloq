<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Veloq — Racing HUD</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #hud {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #stats {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 10px 12px;
        background: rgba(6, 10, 18, 0.78);
        border: 1px solid #1d2836;
        border-radius: 8px;
        color: #7fe7c4;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #banner {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90vw;
        padding: 10px 16px;
        background: #3b1219;
        border: 1px solid #ff3b4e;
        border-radius: 8px;
        color: #ffd7dc;
        font-size: 13px;
        text-align: center;
      }
      #banner[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="hud"></canvas>
    <div id="banner" hidden></div>
    <div id="stats">booting…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
